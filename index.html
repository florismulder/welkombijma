<title>MA Studentenmenu</title>
<style>
/* Layout: één smalle kolom. Grote outline-tegels met ronde hoeken, zoals de vormen in het MA-logo.
   Kleurverhouding uit de huisstijl: wit 70, magenta 10, zwart 20. Magenta alleen als vlak, nooit als kleine tekst op wit. */
:root{
  --bg:#FFFFFF; --fg:#000000; --muted:#4A4A4A; --line:#000000; --rule:#D6D6D6; --soft:#F4F4F4;
  --accent:#FF00E6; --on-accent:#000000; --tile:#FFFFFF; --plate:#FFFFFF;
  --font:Arial,Helvetica,sans-serif;
  --r:8px; --r-s:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0D0D; --fg:#FFFFFF; --muted:#D6D6D6; --line:#FFFFFF; --rule:#4A4A4A; --soft:#1A1A1A; --tile:#0D0D0D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0D0D; --fg:#FFFFFF; --muted:#D6D6D6; --line:#FFFFFF; --rule:#4A4A4A; --soft:#1A1A1A; --tile:#0D0D0D;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-inline:16px;padding-block:20px 112px}
.wrap{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.plate{background:var(--plate);border-radius:var(--r);padding:8px 12px;display:inline-flex}
.plate img{display:block;height:40px;width:auto}
.klas{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

h1{font-size:clamp(30px,7vw,44px);line-height:1.08;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:22px;line-height:1.2;margin:0 0 14px;text-wrap:balance}
.lead{margin:0 0 18px;color:var(--muted);max-width:52ch}
.zoek{width:100%;font:inherit;font-size:16px;padding:14px 18px;border:2px solid var(--line);border-radius:var(--r);
  background:var(--tile);color:var(--fg)}
.zoek::placeholder{color:var(--muted);opacity:1}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:2px;min-width:0;text-decoration:none;background:var(--tile);color:var(--fg);
  border:2px solid var(--line);border-radius:var(--r);padding:14px 18px;min-height:78px;justify-content:center}
.tile b{font-size:18px}
.tile span{font-size:14px;color:var(--muted)}
.tile:hover,.tile:focus-visible{background:var(--accent);color:var(--on-accent)}
.tile:hover span,.tile:focus-visible span{color:var(--on-accent)}

.vak{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:var(--r);background:var(--soft);padding:14px 18px}
.vak .dot{width:14px;height:14px;border-radius:var(--r-s);background:var(--accent);flex:none}
.vak p{margin:0;flex:1;min-width:200px}
.vak button{font:inherit;font-size:14px;font-weight:700;background:none;color:var(--fg);border:2px solid var(--line);
  border-radius:var(--r);padding:6px 14px;cursor:pointer;min-height:40px}
.vak ul{flex-basis:100%;margin:4px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.vak li{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--rule);padding-top:6px}
.vak li span:last-child{color:var(--muted);text-align:right}

details.groep{border-top:2px solid var(--line)}
details.groep:last-of-type{border-bottom:2px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 0;min-height:64px}
summary::-webkit-details-marker{display:none}
summary .tekst{flex:1;min-width:0}
summary strong{display:block;font-size:20px;line-height:1.2}
summary small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
summary::after{content:"+";flex:none;width:34px;height:34px;border-radius:var(--r);background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-size:24px;line-height:1;font-weight:700}
details[open] summary::after{content:"\2212"}
.links{list-style:none;margin:0 0 14px;padding:0}
.links li{border-top:1px solid var(--rule)}
.links a{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 0;text-decoration:none;min-height:48px}
.links a:hover b,.links a:focus-visible b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.links .t{min-width:0}
.links b{display:block}
.links .d{display:block;font-size:14px;color:var(--muted)}
.pill{flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;border:1.5px solid var(--line);border-radius:var(--r-s);padding:1px 8px}
.pijl{flex:none;font-weight:700}

.contacten{list-style:none;margin:0;padding:0;display:grid;gap:0}
.contacten li{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--rule);padding:12px 0}
.contacten li:last-child{border-bottom:1px solid var(--rule)}
.contacten .w{flex:1;min-width:180px}
.contacten .w b{display:block}
.contacten .w span{font-size:14px;color:var(--muted)}
.contacten code{font:inherit;font-weight:700;user-select:all;word-break:break-all}
.kopie{font:inherit;font-size:14px;font-weight:700;background:var(--tile);color:var(--fg);border:2px solid var(--line);
  border-radius:var(--r);padding:6px 14px;min-height:40px;cursor:pointer}
.kopie:hover{background:var(--accent);color:var(--on-accent)}

.leeg{text-align:center;color:var(--muted)}
footer{font-size:13px;color:var(--muted);max-width:60ch}
footer a{color:var(--fg)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:760px;margin-inline:auto;display:flex;gap:10px}
.bar a,.bar button{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font:inherit;font-weight:700;
  min-height:48px;border-radius:var(--r);border:2px solid var(--line);text-decoration:none;cursor:pointer;padding:6px 12px}
.bar a{background:var(--tile);color:var(--fg)}
.bar button{background:var(--accent);color:var(--on-accent)}
.bar a:hover{background:var(--soft)}
@media (prefers-reduced-motion: no-preference){ html{scroll-behavior:smooth} }
</style>

(function(){
  var $ = function(id){return document.getElementById(id)};
  function el(tag, cls, text){var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e}
  function norm(s){return String(s).toLowerCase()}

  // Elke dag
  var tiles=$("tiles");
  DATA.dagelijks.forEach(function(x){
    var a=el("a","tile"); a.href=x.u; a.target="_blank"; a.rel="noopener";
    a.appendChild(el("b",null,x.t)); a.appendChild(el("span",null,x.d));
    a.dataset.s=norm(x.t+" "+x.d); tiles.appendChild(a);
  });

  // Groepen
  var lijst=$("lijst");
  DATA.groepen.forEach(function(g){
    var det=el("details","groep"); det.id="g-"+g.id;
    var sum=el("summary"); var tk=el("span","tekst");
    tk.appendChild(el("strong",null,g.t)); tk.appendChild(el("small",null,g.i+" ("+g.links.length+")"));
    sum.appendChild(tk); det.appendChild(sum);
    var ul=el("ul","links");
    g.links.forEach(function(x){
      var li=el("li"); li.dataset.s=norm(x.t+" "+x.d+" "+g.t);
      var a=el("a"); a.href=x.u; a.target="_blank"; a.rel="noopener";
      var t=el("span","t"); t.appendChild(el("b",null,x.t)); t.appendChild(el("span","d",x.d));
      a.appendChild(t);
      if(/\.pdf$/i.test(x.u)) a.appendChild(el("span","pill","PDF")); else a.appendChild(el("span","pijl","↗"));
      li.appendChild(a); ul.appendChild(li);
    });
    det.appendChild(ul); lijst.appendChild(det);
  });

  // Contacten
  var cl=$("contacten");
  DATA.contacten.forEach(function(c){
    var li=el("li"); li.dataset.s=norm(c.w+" "+c.m+" "+(c.x||""));
    var w=el("div","w"); w.appendChild(el("b",null,c.w));
    var code=el("code",null,c.m); w.appendChild(code);
    if(c.x) w.appendChild(el("span",null,c.x));
    var b=el("button","kopie","Kopieer"); b.type="button";
    b.setAttribute("aria-label","Kopieer "+c.m);
    b.addEventListener("click",function(){
      function klaar(){b.textContent="Gekopieerd"; setTimeout(function(){b.textContent="Kopieer"},1800)}
      function selecteer(){var r=document.createRange(); r.selectNodeContents(code); var s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent="Geselecteerd"; setTimeout(function(){b.textContent="Kopieer"},1800)}
      try{ navigator.clipboard.writeText(c.m).then(klaar,selecteer) }catch(e){ selecteer() }
    });
    li.appendChild(w); li.appendChild(b); cl.appendChild(li);
  });

  // Vakantie
  (function(){
    var box=$("vak"); var nu=new Date(); nu.setHours(0,0,0,0);
    function d(s){var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2])}
    function f(x){return x.toLocaleDateString("nl-NL",{day:"numeric",month:"long"})}
    function bereik(v){var a=d(v[1]),b=d(v[2]); return a.getTime()===b.getTime()? f(a): f(a)+" t/m "+f(b)}
    var vol=DATA.vakanties.filter(function(v){return d(v[2])>=nu}).sort(function(a,b){return d(a[1])-d(b[1])});
    box.appendChild(el("span","dot"));
    var p=el("p");
    if(vol.length){
      var v=vol[0], s=d(v[1]);
      if(s<=nu){ p.textContent="Nu: "+v[0]+", "+bereik(v)+"." }
      else { var n=Math.round((s-nu)/86400000); p.textContent="Eerstvolgende vakantie: "+v[0]+", "+bereik(v)+". Over "+n+(n===1?" dag.":" dagen.") }
    } else { p.textContent="Het vakantierooster van dit schooljaar is voorbij." }
    box.appendChild(p);
    var btn=el("button",null,"Alle vakanties"); btn.type="button"; btn.setAttribute("aria-expanded","false");
    var ul=el("ul"); ul.hidden=true;
    DATA.vakanties.forEach(function(v){var li=el("li"); li.appendChild(el("span",null,v[0])); li.appendChild(el("span",null,bereik(v))); ul.appendChild(li)});
    btn.addEventListener("click",function(){ul.hidden=!ul.hidden; btn.setAttribute("aria-expanded",String(!ul.hidden)); btn.textContent=ul.hidden?"Alle vakanties":"Sluiten"});
    box.appendChild(btn); box.appendChild(ul);
  })();

  // Voet
  var voet=$("voet");
  voet.textContent="Dit menu is gemaakt door je docent voor de klassen van Mediaredactiemedewerker. Het is niet de officiële website van MA. Controleer belangrijke zaken altijd op welkombijma.nl. Gegevens voor schooljaar "+DATA.schooljaar+", bijgewerkt in "+DATA.bijgewerkt+".";

  // Balk onderaan
  $("ziek").href=DATA.ziekUrl;
  $("hulp-knop").addEventListener("click",function(){
    $("q").value=""; zoek();
    var g=$("g-hulp"); g.hidden=false; g.open=true; g.scrollIntoView(); 
  });

  // Zoeken
  function zoek(){
    var q=norm($("q").value).trim(), zichtbaar=0;
    var terms=q? q.split(/\s+/):[];
    function match(s){return terms.every(function(t){return s.indexOf(t)>-1})}
    var tl=tiles.children, tz=0;
    for(var i=0;i<tl.length;i++){var ok=!q||match(tl[i].dataset.s); tl[i].hidden=!ok; if(ok) tz++}
    $("dagelijks").hidden=tz===0; zichtbaar+=tz;
    var gs=lijst.children, gz=0;
    for(var j=0;j<gs.length;j++){
      var items=gs[j].querySelectorAll(".links li"), n=0;
      for(var k=0;k<items.length;k++){var ok2=!q||match(items[k].dataset.s); items[k].hidden=!ok2; if(ok2) n++}
      gs[j].hidden=n===0; if(n) gz++;
      gs[j].open = !!q && n>0;
    }
    $("onderwerpen").hidden=gz===0; zichtbaar+=gz;
    var cs=cl.children, cz=0;
    for(var m=0;m<cs.length;m++){var ok3=!q||match(cs[m].dataset.s); cs[m].hidden=!ok3; if(ok3) cz++}
    $("contact").hidden=cz===0; zichtbaar+=cz;
    $("vak").hidden=!!q;
    $("leeg").hidden=!q||zichtbaar>0;
  }
  $("q").addEventListener("input",zoek);
})();
</script>
